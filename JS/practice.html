    <h3>Practice Exercise — Control Flow</h3>
<p>
Write a JavaScript program that:
<ol>
    <li>Stores the current hour (0–23) in a variable</li>
    <li>Prints 'Good morning' if hour is before 12</li>
    <li>Prints 'Good afternoon' if hour is 12–17</li>
    <li>Prints 'Good evening' if hour is 18 or later</li>
</ol>
</p>
